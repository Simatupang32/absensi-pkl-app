<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi PKL</title>

<!-- Ikon & tampilan saat dipasang di HP -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absensi PKL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>
  /* ================================================================
     GANTI dengan URL Web App Google Apps Script Anda (yang berakhiran /exec)
     Apps Script > Deploy > Manage deployments > salin "Web app URL"
     ================================================================ */
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwIdnPUAp51HiXbMJKx5WWFSsCdE2QKfYXMeOQEeIww58Fer6rMmHsc2QiqtjF-K1Mj/exec';
</script>

<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2937}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .wrap img{width:160px;height:160px}
  h1{margin:6px 0 4px;font-size:22px;color:#1e3a8a}
  .s{font-size:14px;color:#6b7280;max-width:340px}
  .btn{display:block;width:100%;max-width:320px;margin-top:12px;padding:14px 18px;border-radius:12px;border:0;
       background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;font-size:16px;cursor:pointer}
  .btn.ghost{background:#eef2ff;color:#1d4ed8}
  .ios{margin-top:16px;max-width:340px;background:#f3f4f6;border-radius:12px;padding:12px 14px;font-size:14px;text-align:left;line-height:1.5}
  .spin{width:28px;height:28px;margin:18px auto 0;border:3px solid #dbeafe;border-top-color:#1d4ed8;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img src="logo.png" alt="" onerror="this.style.visibility='hidden'">
  <h1>Absensi PKL</h1>
  <div class="s" id="msg">Absensi siswa PKL dengan selfie &amp; lokasi.</div>
  <div class="spin hidden" id="spin"></div>

  <a id="btnOpen" class="btn" href="#">Buka Absensi</a>
  <button id="btnInstall" class="btn ghost hidden">📲 Pasang di HP</button>
  <div id="iosHelp" class="ios hidden">
    <b>Pasang di iPhone:</b><br>
    1. Tekan tombol <b>Bagikan</b> ⬆️ di Safari<br>
    2. Pilih <b>"Tambah ke Layar Utama"</b><br>
    3. Tekan <b>Tambah</b>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const belumDiisi = APP_URL.indexOf('GANTI_DENGAN') >= 0;
  $('btnOpen').href = APP_URL;

  // Dibuka dari ikon di layar utama (sudah terpasang) -> langsung masuk ke aplikasi absensi
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  if (belumDiisi) {
    $('msg').innerHTML = 'URL aplikasi belum diisi.<br>Ganti <b>APP_URL</b> di index.html dengan URL Web App Apps Script.';
    $('btnOpen').classList.add('hidden');
  } else if (standalone) {
    $('msg').textContent = 'Membuka aplikasi…';
    $('btnOpen').classList.add('hidden');
    $('spin').classList.remove('hidden');
    location.replace(APP_URL);
  }

  // Tombol pasang (Android / Chrome / Edge)
  let promptEvent = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); promptEvent = e;
    if (!standalone) $('btnInstall').classList.remove('hidden');
  });
  $('btnInstall').onclick = async () => {
    if (!promptEvent) return;
    promptEvent.prompt();
    await promptEvent.userChoice;
    promptEvent = null;
    $('btnInstall').classList.add('hidden');
  };
  window.addEventListener('appinstalled', () => {
    $('msg').textContent = '✅ Terpasang! Buka "Absensi PKL" dari layar utama HP.';
  });

  // Petunjuk iPhone (Safari tidak punya tombol pasang otomatis)
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) $('iosHelp').classList.remove('hidden');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
